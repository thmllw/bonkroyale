<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>BonkRoyale</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:100%;height:100%;overflow:hidden;font-family:'Segoe UI',system-ui,-apple-system,sans-serif;
    user-select:none;-webkit-user-select:none;touch-action:none;-webkit-tap-highlight-color:transparent}
  body{display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at center,#1c2033 0%,#06070b 75%)}
  #game{position:relative;overflow:hidden;background:#0f1a2a;box-shadow:0 0 70px rgba(0,0,0,.85);border-radius:8px}
  #game canvas{display:block}
  #ui{position:absolute;inset:0;pointer-events:none}
  button{font-family:inherit}

  /* =================== CARTES (style commun) =================== */
  .card{position:relative;aspect-ratio:4/5;border-radius:.5em;border:3px solid #6b7f99;cursor:pointer;
    display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;
    box-shadow:0 3px 0 #000;transition:transform .12s,filter .15s,border-color .12s}
  .card.r-common{border-color:#8fa3bd}
  .card.r-rare{border-color:#ff9a2e}
  .card.r-epic{border-color:#c04ef0}
  .card .icon{font-size:2em;line-height:1.1;filter:drop-shadow(0 2px 2px rgba(0,0,0,.5))}
  .card .name{font-size:.62em;font-weight:800;text-shadow:0 1px 2px #000;margin-top:.15em;text-align:center;line-height:1.1;padding:0 .15em}
  .card .cost{position:absolute;top:-.45em;left:-.45em;width:1.6em;height:1.6em;border-radius:50%;
    background:radial-gradient(circle at 35% 30%,#f5a8ff,#b01ee0 60%,#5c0a7a);border:2px solid #2a0538;
    display:flex;align-items:center;justify-content:center;font-weight:900;font-size:.85em;text-shadow:0 1px 1px #000}
  .card.sel{transform:translateY(-.55em) scale(1.04);border-color:#ffe14a;box-shadow:0 0 12px #ffe14a,0 3px 0 #000}
  .card.off{filter:grayscale(.85) brightness(.6)}
  .card.picked{border-color:#ffe14a;box-shadow:0 0 14px #ffe14a,0 3px 0 #000;transform:scale(1.05)}
  .card.wiggle{animation:wiggle .35s ease-in-out infinite}
  @keyframes wiggle{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}

  /* =================== HUD DE COMBAT =================== */
  #hud{position:absolute;inset:0;pointer-events:none}
  #game.in-menu #hud{display:none}
  #topbar{position:absolute;top:.5em;left:.5em;right:.5em;display:flex;justify-content:space-between;align-items:flex-start}
  .crowns{background:rgba(0,0,0,.6);padding:.2em .7em;border-radius:1em;color:#fff;font-weight:800;font-size:1.05em;
    display:flex;gap:.35em;align-items:center}
  .crowns.enemy{border:2px solid #ff4a4a}
  .crowns.player{border:2px solid #4aa3ff}
  .crowns small{font-size:.6em;opacity:.8;font-weight:700}
  #timer{background:rgba(0,0,0,.65);color:#fff;font-weight:900;padding:.15em .8em .2em;border-radius:.6em;font-size:1.25em;text-align:center;min-width:4.2em}
  #timer small{display:block;font-size:.45em;color:#ffd84a;letter-spacing:.05em;height:1.1em}
  .tlabel{position:absolute;transform:translate(-50%,-100%);font-size:.62em;font-weight:900;color:#fff;
    text-shadow:0 1px 2px #000,0 0 3px #000;white-space:nowrap}

  #bottom{position:absolute;left:0;right:0;bottom:0;padding:.55em .5em .6em;pointer-events:auto;
    background:linear-gradient(to top,rgba(28,16,6,.97),rgba(50,32,12,.9));border-top:3px solid #6b4518}
  #hand{display:grid;grid-template-columns:.75fr repeat(4,1fr);gap:.4em;align-items:end}
  #nextWrap{display:flex;flex-direction:column;align-items:center;gap:.15em}
  #nextWrap small{color:#e8d3b0;font-size:.55em;font-weight:800;letter-spacing:.05em}
  #nextWrap .card{width:100%;font-size:.75em;cursor:default;filter:brightness(.85)}
  #elixirWrap{display:flex;align-items:center;gap:.4em;margin-top:.5em}
  #elixirDrop{width:2em;height:2em;border-radius:50% 50% 50% 50%/60% 60% 40% 40%;flex:none;
    background:radial-gradient(circle at 35% 30%,#f5a8ff,#b01ee0 60%,#5c0a7a);border:2px solid #2a0538;
    display:flex;align-items:center;justify-content:center;color:#fff;font-weight:900;font-size:1em;text-shadow:0 1px 2px #000}
  #elixirBar{flex:1;height:1.15em;background:#2a1030;border-radius:.6em;overflow:hidden;position:relative;border:2px solid #000}
  #elixirFill{height:100%;width:50%;background:linear-gradient(#f08bff,#a320d6 60%,#7a10a8)}
  #elixirTicks{position:absolute;inset:0;background:repeating-linear-gradient(to right,transparent 0,transparent calc(10% - 2px),rgba(0,0,0,.55) calc(10% - 2px),rgba(0,0,0,.55) 10%)}
  #toast{position:absolute;left:50%;bottom:10.2em;transform:translateX(-50%);background:rgba(0,0,0,.8);color:#ffd84a;
    font-weight:800;font-size:.8em;padding:.35em .9em;border-radius:1em;opacity:0;transition:opacity .2s;white-space:nowrap}
  #toast.show{opacity:1}

  /* =================== MENU PRINCIPAL =================== */
  #menu{position:absolute;inset:0;display:none;flex-direction:column;pointer-events:auto;color:#fff}
  #game.in-menu #menu{display:flex}
  .m-top{display:flex;justify-content:space-between;align-items:center;padding:.5em .6em;
    background:linear-gradient(#22488a,#14305f);border-bottom:3px solid #0b1d3d;box-shadow:0 3px 8px rgba(0,0,0,.4)}
  .profile{display:flex;gap:.45em;align-items:center}
  .lvl{width:2.1em;height:2.3em;background:linear-gradient(#5aa9ff,#1f5fc2);display:flex;align-items:center;justify-content:center;
    font-weight:900;clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);text-shadow:0 1px 2px #000}
  .profile b{display:block;font-size:.9em}
  .profile small{font-size:.75em;color:#ffd84a;font-weight:800}
  .res{display:flex;gap:.35em}
  .res span{background:rgba(0,0,0,.45);padding:.2em .55em;border-radius:1em;font-size:.78em;font-weight:800;border:1px solid rgba(255,255,255,.15)}

  .tab{flex:1;display:none;flex-direction:column;min-height:0}
  .tab.active{display:flex}

  #tabPlay{justify-content:space-between;align-items:center;padding:.9em .6em .8em;
    background:linear-gradient(to bottom,rgba(10,25,55,.55),rgba(10,25,55,0) 25%,rgba(10,25,55,0) 55%,rgba(10,25,55,.85))}
  .logo{width:58%;max-width:14em;height:auto;display:block;filter:drop-shadow(0 6px 10px rgba(0,0,0,.6))}
  .top-play{width:100%;display:flex;flex-direction:column;align-items:center;gap:.6em}
  .arena-name{text-align:center;background:rgba(0,0,0,.5);padding:.4em 1.3em;border-radius:.7em;font-size:.72em;
    letter-spacing:.1em;color:#cfe3ff;border:2px solid rgba(255,216,74,.4)}
  .arena-name b{display:block;font-size:1.45em;color:#ffd84a;letter-spacing:.02em;text-shadow:0 2px 0 #000}
  .play-zone{width:100%;display:flex;flex-direction:column;align-items:center;gap:.7em}
  .deck-title{font-size:.7em;font-weight:800;letter-spacing:.1em;color:#cfe3ff}
  #deckMini{display:grid;grid-template-columns:repeat(8,1fr);gap:.25em;background:rgba(0,0,0,.5);padding:.4em;border-radius:.6em;width:100%;cursor:pointer}
  #deckMini .card{font-size:.55em;border-width:2px;box-shadow:none}
  #deckMini .card .name{display:none}
  #btnBattle{font-size:1.65em;font-weight:900;color:#5a3a00;padding:.4em 2.3em;border-radius:.5em;border:3px solid #7a4b00;
    background:linear-gradient(#fff0a0,#ffc93a 50%,#f29a10);box-shadow:0 5px 0 #7a4b00,inset 0 2px 0 rgba(255,255,255,.7);
    text-shadow:0 1px 0 rgba(255,255,255,.6);cursor:pointer;animation:pulse 1.6s ease-in-out infinite}
  #btnBattle:active{transform:translateY(4px);box-shadow:0 1px 0 #7a4b00;animation:none}
  @keyframes pulse{50%{transform:scale(1.05)}}
  .record{font-size:.72em;color:#cfe3ff;font-weight:700}

  #tabDeck{background:linear-gradient(#2d5cab,#1b3a74);overflow-y:auto;padding:.7em .7em 1em;gap:.55em}
  .sec-head{display:flex;justify-content:space-between;align-items:baseline}
  .sec-head h2{font-size:1em;font-weight:900;letter-spacing:.04em;text-shadow:0 2px 0 #0b1d3d}
  .sec-head span{font-size:.75em;font-weight:800;color:#f5c4ff}
  .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:.55em;background:rgba(0,0,0,.25);padding:.7em .6em;border-radius:.6em}
  .grid.empty::after{content:'Toutes vos cartes sont dans le deck';grid-column:1/-1;text-align:center;font-size:.75em;opacity:.7;padding:.6em}
  #cardInfo{background:rgba(0,0,0,.35);border-radius:.6em;padding:.55em .7em;min-height:4.4em;font-size:.82em}
  #cardInfo .hint{opacity:.75;text-align:center;padding-top:.9em}
  #cardInfo .head{display:flex;justify-content:space-between;align-items:center;gap:.5em}
  #cardInfo .head b{font-size:1.1em}
  #cardInfo .rar{font-size:.7em;font-weight:900;padding:.1em .5em;border-radius:.5em;margin-left:.4em}
  .rar.r-common{background:#8fa3bd;color:#14243a}.rar.r-rare{background:#ff9a2e;color:#3d1e00}.rar.r-epic{background:#c04ef0}
  #cardInfo p{opacity:.85;margin:.25em 0 .4em;font-size:.9em}
  #cardInfo .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:.3em}
  #cardInfo .stats div{background:rgba(255,255,255,.08);border-radius:.4em;padding:.2em .4em;font-size:.8em}
  #cardInfo .stats small{display:block;opacity:.65;font-size:.85em}
  .btn{border:none;color:#fff;font-weight:900;padding:.4em 1em;border-radius:.45em;cursor:pointer;font-size:.9em;text-shadow:0 1px 1px #000}
  .btn.green{background:linear-gradient(#6fe06f,#2f9e2f);box-shadow:0 3px 0 #0b3a0b}
  .btn.grey{background:linear-gradient(#8a96a8,#56627a);box-shadow:0 3px 0 #252c3a}

  .m-tabs{display:flex;background:linear-gradient(#1a3566,#0f2347);border-top:3px solid #0b1d3d;padding:0 .4em}
  .m-tabs button{flex:1;border:none;background:transparent;color:#8fa6cc;font-weight:900;font-size:1.35em;padding:.35em 0 .45em;
    display:flex;flex-direction:column;align-items:center;cursor:pointer;transition:transform .15s}
  .m-tabs button span{font-size:.5em;letter-spacing:.12em;margin-top:.1em}
  .m-tabs button.active{background:linear-gradient(#5b97ea,#2a5ab0);color:#fff;transform:translateY(-.3em);
    border-radius:.55em .55em 0 0;box-shadow:0 -3px 0 #0b1d3d,inset 0 2px 0 rgba(255,255,255,.35)}

  /* =================== OVERLAY FIN DE PARTIE =================== */
  #overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.8em;
    background:rgba(5,8,16,.75);pointer-events:auto;text-align:center;color:#fff;padding:1.5em}
  #overlay.hidden{display:none}
  #overlay h1{font-size:2.2em;font-weight:900;letter-spacing:.02em;text-shadow:0 3px 0 #000,0 0 18px rgba(255,210,60,.6);color:#ffd84a}
  #overlay p{font-size:.95em;opacity:.95;line-height:1.5;max-width:20em}
  #overlay .trophy{font-size:1.2em;font-weight:900}
  #overlay button{font-size:1.1em;font-weight:900;color:#fff;padding:.55em 1.6em;border-radius:.6em;border:3px solid #0b3a0b;
    background:linear-gradient(#6fe06f,#2f9e2f);box-shadow:0 4px 0 #0b3a0b;cursor:pointer;text-shadow:0 1px 2px #000}
  #overlay button:active{transform:translateY(3px);box-shadow:0 1px 0 #0b3a0b}
</style>
</head>
<body>
<div id="game" class="in-menu">
  <div id="ui">

    <!-- ============ HUD DE COMBAT ============ -->
    <div id="hud">
      <div id="topbar">
        <div class="crowns enemy"><small>IA</small>👑<b id="crEnemy">0</b></div>

function checkerTexture(cols, rows, c1, c2) {
  const s = 32, cv = document.createElement('canvas');
  cv.width = cols * s; cv.height = rows * s;
  const ctx = cv.getContext('2d');
  for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) {
    ctx.fillStyle = (r + c) % 2 ? c1 : c2;
    ctx.fillRect(c * s, r * s, s, s);
  }
  for (let i = 0; i < 400; i++) {
    ctx.fillStyle = 'rgba(30,80,20,0.15)';
    ctx.fillRect(Math.random() * cv.width, Math.random() * cv.height, 2, 4);
  }
  const tex = new THREE.CanvasTexture(cv);
  tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
  return tex;
}

   ========================================================= */
function createTower(team, type, x, z) {
  const king = type === 'king';
  const T = TEAM[team];
  const g = new THREE.Group();
  g.position.set(x, 0, z);
  const add = (geo, mat, px, py, pz) => {
    const m = new THREE.Mesh(geo, mat);
    m.position.set(px, py, pz);
    m.castShadow = true; m.receiveShadow = true;
    g.add(m); return m;
  };
  const stone = lam(0xbdb6a9), stoneDark = lam(0x8f887c), tm = lam(T.color);
  if (king) {
    add(new THREE.BoxGeometry(3.4, 0.6, 3.4), stoneDark, 0, 0.3, 0);
    add(new THREE.BoxGeometry(2.7, 2.2, 2.7), stone, 0, 1.7, 0);
    add(new THREE.BoxGeometry(3.0, 0.5, 3.0), tm, 0, 3.05, 0);
    for (const cx of [-1.2, 1.2]) for (const cz of [-1.2, 1.2])
      add(new THREE.BoxGeometry(0.6, 0.6, 0.6), stone, cx, 3.6, cz);
    const gold = new THREE.MeshLambertMaterial({ color: 0xffcf3a, emissive: 0x332200 });
    add(new THREE.CylinderGeometry(0.55, 0.65, 0.45, 10), gold, 0, 3.55, 0);
    for (let i = 0; i < 5; i++) {
      const a = i / 5 * Math.PI * 2;
      add(new THREE.ConeGeometry(0.13, 0.4, 6), gold, Math.cos(a) * 0.5, 3.95, Math.sin(a) * 0.5);
    }
  } else {
    add(new THREE.CylinderGeometry(1.35, 1.45, 0.5, 16), stoneDark, 0, 0.25, 0);
    add(new THREE.CylinderGeometry(1.0, 1.15, 2.4, 16), stone, 0, 1.45, 0);
    add(new THREE.CylinderGeometry(1.28, 1.15, 0.45, 16), tm, 0, 2.85, 0);
    for (let i = 0; i < 6; i++) {
      const a = i / 6 * Math.PI * 2;
      add(new THREE.BoxGeometry(0.4, 0.45, 0.4), stone, Math.cos(a) * 1.05, 3.3, Math.sin(a) * 1.05);
    }
    add(new THREE.CylinderGeometry(0.2, 0.3, 0.55, 10), lam(T.dark), 0, 3.35, 0);
    add(new THREE.SphereGeometry(0.22, 12, 10), lam(0xf1c79b), 0, 3.8, 0);
  }
  scene.add(g);
  const mats = [];
  g.traverse(o => { if (o.isMesh && !mats.includes(o.material)) mats.push(o.material); });
  const label = document.createElement('div');
  label.className = 'tlabel';
  $('labels').appendChild(label);
  const t = {
    kind: 'tower', team, type, x, z, alive: true,
    hp: king ? 4000 : 2500, maxHp: king ? 4000 : 2500,
    radius: king ? 1.7 : 1.3, range: 7.5,
    dmg: king ? 120 : 95, rate: king ? 1.0 : 0.8, cd: 0,
    active: !king, target: null, hitY: king ? 3.3 : 2.9, barY: king ? 4.7 : 4.2,
    mesh: g, mats, flash: 0, label,
    hpBar: makeHpBar(king ? 2.6 : 2.0, T.bar)
  };
  towers.push(t);
  return t;
}

      add(Sph(0.12), lam(0xe0662b), 0.28, 0.95, -0.12);
      add(Cyl(0.04, 0.04, 1.0, 6), wood, 0.55, 0.8, 0.1).rotation.x = Math.PI / 2;
      add(Box(0.05, 0.45, 0.35), metal, 0.55, 0.8, 0.55);
      break;
    case 'minipekka': {
      const armor = lam(0x3c4656);
      add(Box(0.18, 0.5, 0.2), armor, -0.2, 0.25, 0);
      add(Box(0.18, 0.5, 0.2), armor, 0.2, 0.25, 0);
      add(Box(0.7, 0.6, 0.55), armor, 0, 0.8, 0);
      add(Sph(0.2), tm, -0.42, 1.05, 0);
      add(Sph(0.2), tm, 0.42, 1.05, 0);
      add(Box(0.5, 0.4, 0.5), armor, 0, 1.3, 0);
      add(Cone(0.07, 0.35, 6), armor, -0.2, 1.6, 0).rotation.z = 0.4;
      add(Cone(0.07, 0.35, 6), armor, 0.2, 1.6, 0).rotation.z = -0.4;
      add(Sph(0.07, 8, 6), new THREE.MeshBasicMaterial({ color: 0x55e6ff }), 0, 1.32, 0.26);
      add(Box(0.1, 0.12, 1.2), metal, 0.5, 0.8, 0.45);
      break;
    }
    case 'hog': {
      const pig = lam(0x8b5a3c);
      const b = add(Sph(0.45, 14), pig, 0, 0.55, 0); b.scale.set(1, 0.8, 1.5);
      for (const [lx, lz] of [[-0.25, -0.4], [0.25, -0.4], [-0.25, 0.4], [0.25, 0.4]]) add(Cyl(0.08, 0.08, 0.35, 6), pig, lx, 0.18, lz);
      add(Cyl(0.13, 0.13, 0.12, 10), lam(0xe8a0a0), 0, 0.55, 0.72).rotation.x = Math.PI / 2;
      add(Cyl(0.25, 0.32, 0.55, 10), tm, 0, 1.15, -0.1);
      add(Sph(0.22), skin, 0, 1.55, -0.1);
      add(Box(0.07, 0.15, 0.4), black, 0, 1.75, -0.1);
      add(Cyl(0.04, 0.04, 0.8, 6), wood, 0.4, 1.3, 0.1);
      add(Box(0.25, 0.25, 0.35), metal, 0.4, 1.7, 0.1);
      break;
    }
    case 'wizard':
      add(Cone(0.45, 1.1, 14), tm, 0, 0.55, 0);
      add(Sph(0.26, 14), skin, 0, 1.25, 0);
      add(Cone(0.15, 0.35, 8), lam(0xdddddd), 0, 1.0, 0.17).rotation.x = Math.PI;
      add(Cone(0.32, 0.6, 12), dark, 0, 1.62, 0);
      add(Cyl(0.04, 0.04, 1.4, 6), wood, 0.4, 0.75, 0.1);
      add(Sph(0.13, 10, 8), new THREE.MeshBasicMaterial({ color: 0xff8a1e }), 0.4, 1.5, 0.1);
      break;
  }
  // disque coloré au sol (identifie l'équipe)
  const ground = new THREE.Mesh(new THREE.CircleGeometry(CARDS[type].radius, 18),
    new THREE.MeshBasicMaterial({ color: T.color, transparent: true, opacity: 0.35, depthWrite: false }));
  ground.rotation.x = -Math.PI / 2;
  ground.position.y = 0.02;
  root.add(ground);

  const mats = [];
  body.traverse(o => { if (o.isMesh && !mats.includes(o.material)) mats.push(o.material); });
  return { root, body, mats };
}

function groupOffsets(n, r) {
  if (n === 3) return [[0, -1], [-1, 0.7], [1, 0.7]].map(([x, z]) => [x * r * 1.6, z * r * 1.6]);
  if (n === 4) return [[-1, -1], [1, -1], [-1, 1], [1, 1]].map(([x, z]) => [x * r * 1.2, z * r * 1.2]);
  return [[0, 0]];
}

function spawn(type, team, x, z) {
  const c = CARDS[type];
  const s = TEAM[team].side;
  for (const [ox, oz] of groupOffsets(c.count, c.radius)) {
    const { root, body, mats } = buildUnitMesh(type, team);
    const u = {
      kind: 'unit', type, team, stats: c, alive: true,
      x: clamp(x + ox, -W_HALF + 0.5, W_HALF - 0.5), z: z + oz * s,
      hp: c.hp, maxHp: c.hp, radius: c.radius, hitY: c.barY * 0.55,
      mesh: root, body, mats, target: null, atkCd: 0.4, retarget: 0,
      deploy: 1.0, flash: 0, lunge: 0, walking: false, phase: Math.random() * 6,
      hpBar: makeHpBar(c.barW, TEAM[team].bar)
    };
    root.rotation.y = s > 0 ? Math.PI : 0;
    scene.add(root);
    units.push(u);
  }
  ringFx(x, z, TEAM[team].bar, 3);
}

/* =========================================================
   EFFETS
   ========================================================= */
const partGeo = new THREE.BoxGeometry(0.16, 0.16, 0.16);
function burst(x, y, z, color, n = 10, spd = 4) {
  const mat = new THREE.MeshBasicMaterial({ color });
  for (let i = 0; i < n; i++) {
    const m = new THREE.Mesh(partGeo, mat);
    m.position.set(x, y, z);
    scene.add(m);
    const v = new THREE.Vector3(rand(-1, 1), rand(0.5, 1.5), rand(-1, 1)).multiplyScalar(spd);
    const life = rand(0.4, 0.8);
    fx.push({ life, max: life, mesh: m, update(dt) {
      v.y -= 14 * dt;
      m.position.addScaledVector(v, dt);
      if (m.position.y < 0.05) { m.position.y = 0.05; v.multiplyScalar(0.5); }
      m.scale.setScalar(Math.max(0.01, this.life / this.max));
    }});
  }
}
function ringFx(x, z, color, grow = 3, inner = 0.3) {
  const m = new THREE.Mesh(new THREE.RingGeometry(inner, inner + 0.15, 32),
    new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 0.9, depthWrite: false }));
  m.rotation.x = -Math.PI / 2;
  m.position.set(x, 0.06, z);
  scene.add(m);
  fx.push({ life: 0.5, max: 0.5, mesh: m, update() {
    const k = 1 - this.life / this.max;
    m.scale.setScalar(1 + k * grow);
    m.material.opacity = 0.9 * (1 - k);
  }});
}
function updateFx(dt) {
  for (const f of fx) {
    f.life -= dt;
    f.update(dt);
    if (f.life <= 0) scene.remove(f.mesh);
  }
  fx = fx.filter(f => f.life > 0);
}

/* =========================================================
   PROJECTILES & DÉGÂTS DE ZONE
   ========================================================= */
const projGeo = new THREE.SphereGeometry(1, 10, 8);
const projMats = {
  player: new THREE.MeshBasicMaterial({ color: 0x9fd0ff }),
  enemy: new THREE.MeshBasicMaterial({ color: 0xffb0a0 }),
  cannon: new THREE.MeshBasicMaterial({ color: 0x333333 }),
  fire: new THREE.MeshBasicMaterial({ color: 0xff7a1a }),
  bomb: new THREE.MeshBasicMaterial({ color: 0x151515 })
};
function fireProjectile(x, y, z, target, dmg, mat, size, speed, team, splash = 0) {
  const m = new THREE.Mesh(projGeo, mat);
  m.scale.setScalar(size);
  m.position.set(x, y, z);
  scene.add(m);
  projectiles.push({ mesh: m, target, dmg, speed, team, splash, alive: true });
}

function splashDamage(team, x, z, r, dmg, exclude) {
  for (const e of units) {
    if (!e.alive || e.team === team || e === exclude) continue;
    if (Math.hypot(e.x - x, e.z - z) <= r + e.radius) damage(e, dmg);
  }
}

const _tp = new THREE.Vector3();
function updateProjectiles(dt) {
  for (const p of projectiles) {
    const t = p.target;
    if (!t.alive) { p.alive = false; scene.remove(p.mesh); continue; }
    _tp.set(t.x, t.hitY, t.z);
    const d = _tp.clone().sub(p.mesh.position);
    const len = d.length(), step = p.speed * dt;
    if (len <= step + 0.1) {
      const tx = t.x, tz = t.z;
      damage(t, p.dmg);
      if (p.splash) {
        splashDamage(p.team, tx, tz, p.splash, p.dmg, t);
        ringFx(tx, tz, 0xffa040, 2, p.splash * 0.4);
        burst(tx, 0.5, tz, 0xff8a1e, 8, 3.5);
      } else {
        burst(_tp.x, _tp.y, _tp.z, 0xffe680, 4, 2.5);
      }
      p.alive = false; scene.remove(p.mesh);
    } else {
      p.mesh.position.addScaledVector(d.multiplyScalar(1 / len), step);
    }
  }
  projectiles = projectiles.filter(p => p.alive);
}

function damage(e, amt) {
  if (!e.alive) return;
  e.hp -= amt;
  e.flash = 0.12;
  if (e.kind === 'tower' && e.type === 'king') e.active = true;
  if (e.hp <= 0) { e.hp = 0; kill(e); }
}

function kill(e) {
  e.alive = false;
  if (e.kind === 'unit') {
    scene.remove(e.mesh);
    scene.remove(e.hpBar.group);
    burst(e.x, 0.6, e.z, TEAM[e.team].color, 10, 4);
    burst(e.x, 0.6, e.z, 0xffffff, 5, 3);
  } else {
    e.mesh.scale.y = 0.22;
    e.mats.forEach(m => m.color.multiplyScalar(0.45));
    e.hpBar.group.visible = false;
    e.label.style.display = 'none';
    for (let i = 0; i < 3; i++) burst(e.x + rand(-1, 1), 1.5, e.z + rand(-1, 1), 0x9a948a, 12, 6);
    const winner = other(e.team);
    if (e.type === 'king') {
      crowns[winner] = 3;
      endGame();
    } else {
      crowns[winner] = Math.min(3, crowns[winner] + 1);
      towers.forEach(t => { if (t.team === e.team && t.type === 'king') t.active = true; });
    }
  }
}

/* =========================================================
   IA DES UNITÉS : ciblage & déplacement
   ========================================================= */
const reach = (u, t) => u.stats.range + u.radius + t.radius;

function findTarget(u) {
  let best = null, bd = Infinity;
  if (u.stats.targets === 'all') {
    for (const e of units) {
      if (!e.alive || e.team === u.team) continue;
      const d = dist(u, e);
      if (d <= u.stats.sight + e.radius && d < bd) { bd = d; best = e; }
    }
    if (best) return best;
  }
  for (const t of towers) {
    if (!t.alive || t.team === u.team) continue;
    const d = dist(u, t);
    if (d < bd) { bd = d; best = t; }
  }
  return best;
}

function pickBridge(ux, tx) {
  let best = BRIDGES[0], bc = Infinity;
  for (const bx of BRIDGES) {
    const c = Math.abs(ux - bx) + Math.abs(tx - bx);
    if (c < bc) { bc = c; best = bx; }
  }
  return best;
}

function pathPoint(u, tx, tz) {
  const bx = pickBridge(u.x, tx);
  const onBridge = Math.abs(u.z) < RIVER + 0.4 && Math.abs(u.x - bx) < 1.2;
  if (Math.abs(tz) < RIVER) {
    if (Math.abs(u.z) > RIVER && Math.abs(u.x - bx) > 0.3) return { x: bx, z: Math.sign(u.z) * (RIVER + 0.5) };
    return { x: tx, z: tz };
  }
  const ts = Math.sign(tz);
  if (onBridge) return Math.sign(u.z) === ts && Math.abs(u.z) > RIVER ? { x: tx, z: tz } : { x: bx, z: ts * (RIVER + 0.7) };
  const us = Math.sign(u.z);
  if (us === ts) return { x: tx, z: tz };
  if (Math.abs(u.x - bx) > 0.25) return { x: bx, z: us * (RIVER + 0.5) };
  return { x: bx, z: ts * (RIVER + 0.7) };
}

function faceTo(u, x, z) {
  const target = Math.atan2(x - u.x, z - u.z);
  let d = target - u.mesh.rotation.y;
  while (d > Math.PI) d -= Math.PI * 2;
  while (d < -Math.PI) d += Math.PI * 2;
  u.mesh.rotation.y += d * 0.25;
}

function updateUnit(u, dt) {
  if (u.deploy > 0) { u.deploy -= dt; return; }
  u.atkCd -= dt;
  u.retarget -= dt;
  u.walking = false;
  if (u.lunge > 0) u.lunge -= dt;

  const inReach = u.target && u.target.alive && dist(u, u.target) <= reach(u, u.target);
  if (!u.target || !u.target.alive || (!inReach && u.retarget <= 0)) {
    u.target = findTarget(u);
    u.retarget = 0.3;
  }
  const t = u.target;
  if (!t) return;

  if (dist(u, t) <= reach(u, t)) {
    faceTo(u, t.x, t.z);
    if (u.atkCd <= 0) {
      const st = u.stats;
      u.atkCd = st.atkSpeed;
      if (st.ranged) {
        const mat = u.type === 'wizard' ? projMats.fire : u.type === 'bomber' ? projMats.bomb : projMats[u.team];
        const size = st.splash ? 0.2 : 0.12;
        fireProjectile(u.x, 1.1, u.z, t, st.dmg, mat, size, st.splash ? 11 : 16, u.team, st.splash || 0);
      } else {
        damage(t, st.dmg);
        if (st.splash) { splashDamage(u.team, u.x, u.z, st.splash, st.dmg, t); ringFx(u.x, u.z, 0xffffff, 1.5, st.splash * 0.5); }
        u.lunge = 0.25;
        burst(t.x + (u.x - t.x) * 0.3, 0.8, t.z + (u.z - t.z) * 0.3, 0xffffff, 3, 2);
      }
    }
  } else {
    const wp = pathPoint(u, t.x, t.z);
    const dx = wp.x - u.x, dz = wp.z - u.z, l = Math.hypot(dx, dz) || 1;
    const step = Math.min(l, u.stats.speed * dt);
    u.x += dx / l * step;
    u.z += dz / l * step;
    faceTo(u, wp.x, wp.z);
    u.walking = true;
  }
}

function resolveCollisions() {
  for (let i = 0; i < units.length; i++) {
    const a = units[i];
    if (!a.alive) continue;
    for (let j = i + 1; j < units.length; j++) {
      const b = units[j];
      if (!b.alive) continue;
      const dx = b.x - a.x, dz = b.z - a.z, d = Math.hypot(dx, dz), min = a.radius + b.radius;
      if (d < min && d > 1e-4) {
        const push = (min - d), wa = b.radius / min, wb = a.radius / min;
        a.x -= dx / d * push * wa * 0.5; a.z -= dz / d * push * wa * 0.5;
        b.x += dx / d * push * wb * 0.5; b.z += dz / d * push * wb * 0.5;
      }
    }
    for (const t of towers) {
      if (!t.alive) continue;
      const dx = a.x - t.x, dz = a.z - t.z, d = Math.hypot(dx, dz) || 1e-4, min = a.radius + t.radius;
      if (d < min) { a.x = t.x + dx / d * min; a.z = t.z + dz / d * min; }
    }
    if (Math.abs(a.z) < RIVER) {
      const bx = BRIDGES.reduce((p, c) => Math.abs(c - a.x) < Math.abs(p - a.x) ? c : p);
      if (Math.abs(a.x - bx) > 1.0) {
        if (Math.abs(a.z) > RIVER - 0.4) a.z = (Math.sign(a.z) || 1) * RIVER;
        else a.x = bx + Math.sign(a.x - bx) * 1.0;
      }
    }
    a.x = clamp(a.x, -W_HALF + a.radius, W_HALF - a.radius);
    a.z = clamp(a.z, -L_HALF + a.radius, L_HALF - a.radius);
  }
}

function updateTower(t, dt) {
  if (!t.alive) return;
  t.cd -= dt;
  if (!t.active) return;
  if (t.target && (!t.target.alive || dist(t, t.target) > t.range + t.target.radius)) t.target = null;
  if (!t.target) {
    let bd = Infinity;
    for (const u of units) {
      if (!u.alive || u.team === t.team) continue;
      const d = dist(t, u);
      if (d <= t.range + u.radius && d < bd) { bd = d; t.target = u; }
    }
  }
  if (t.target && t.cd <= 0) {
    t.cd = t.rate;
    fireProjectile(t.x, t.hitY + 0.7, t.z, t.target, t.dmg,
      t.type === 'king' ? projMats.cannon : projMats[t.team], t.type === 'king' ? 0.26 : 0.17, 14, t.team);
  }
}

/* =========================================================
   IA ENNEMIE
   ========================================================= */
function updateAI(dt, rate) {
  ai.elixir = Math.min(10, ai.elixir + rate * dt);
  ai.cd -= dt;
  if (ai.cd > 0) return;
  const card = CARDS[ai.next];
  if (ai.elixir < card.cost) return;

  const threats = units.filter(u => u.alive && u.team === 'player' && u.z < 3).sort((a, b) => a.z - b.z);
  let x, z;
  if (threats.length && card.targets === 'all') {
    const th = threats[0];
    x = clamp(th.x + rand(-1.5, 1.5), -8, 8);
    z = clamp(th.z - (card.ranged ? 6 : 3.5), -15, -2.2);
  } else {
    if (ai.elixir < Math.min(10, card.cost + 2)) return;
    const princ = towers.filter(t => t.team === 'player' && t.type === 'princess' && t.alive);
    let lane = BRIDGES[Math.random() < 0.5 ? 0 : 1];
    if (princ.length) lane = princ.sort((a, b) => a.hp - b.hp)[0].x < 0 ? -5.5 : 5.5;
    x = lane + rand(-1, 1);
    z = ai.next === 'giant' ? -12.5 : (card.speed >= 2.8 ? -2.5 : card.ranged ? rand(-12, -9) : rand(-10, -6));
  }
  spawn(ai.next, 'enemy', clamp(x, -8.4, 8.4), clamp(z, -15.5, -1.8));
  ai.elixir -= card.cost;
  ai.next = ai.deck[Math.floor(Math.random() * ai.deck.length)];
  ai.cd = rand(1, 3.5);
}

/* =========================================================
   ÉLÉMENT CARTE (HTML)
   ========================================================= */
function cardEl(id, extra = '') {
  const c = CARDS[id];
  const el = document.createElement('div');
  el.className = `card r-${c.rarity} ${extra}`;
  el.dataset.id = id;
  el.style.background = `linear-gradient(160deg,${c.bg[0]},${c.bg[1]})`;
  el.innerHTML = `<div class="cost">${c.cost}</div><div class="icon">${c.icon}</div><div class="name">${c.name}${c.count > 1 ? ' x' + c.count : ''}</div>`;
  return el;
}

/* =========================================================
   MAIN DE COMBAT (4 cartes + carte suivante, cycle du deck)
   ========================================================= */
const handEl = $('hand');
function renderHand() {
  handEl.innerHTML = '';
  const nw = document.createElement('div');
  nw.id = 'nextWrap';
  nw.innerHTML = '<small>SUIVANTE</small>';
  nw.appendChild(cardEl(queue[0]));
  handEl.appendChild(nw);
  hand.forEach((id, i) => {
    const el = cardEl(id, selected === i ? 'sel' : '');
    el.addEventListener('pointerdown', e => {
      e.stopPropagation();
      if (state !== 'playing') return;
      selectCard(selected === i ? null : i);
    });
    handEl.appendChild(el);
  });
}
function selectCard(i) {
  selected = i;
  [...handEl.querySelectorAll(':scope > .card')].forEach((el, k) => el.classList.toggle('sel', k === i));
  zoneMain.visible = i !== null;
  for (const s of ['-1', '1']) zonePocket[s].visible = i !== null && pocketOpen('player', +s);
  if (i === null) ghost.visible = false;
}
function playFromHand(i) {
  queue.push(hand[i]);
  hand[i] = queue.shift();
  selected = null;
  renderHand();
  selectCard(null);
}

function pocketOpen(team, sideX) {
  return towers.some(t => t.team === other(team) && t.type === 'princess' && !t.alive && Math.sign(t.x) === sideX);
}
function canDeploy(team, x, z) {
  if (Math.abs(x) > W_HALF - 0.6) return false;
  const zz = z * TEAM[team].side;
  if (zz >= 1.6 && zz <= L_HALF - 0.5) return true;
  if (zz <= -1.6 && zz >= -6 && x !== 0 && pocketOpen(team, Math.sign(x))) return true;
  return false;
}

let toastTimer = 0;
function toast(msg) {
  const el = $('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 1100);
}

const raycaster = new THREE.Raycaster();
const ndc = new THREE.Vector2();
const groundPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);
function pickGround(e) {
  const r = renderer.domElement.getBoundingClientRect();
  ndc.set(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
  raycaster.setFromCamera(ndc, camera);
  const p = new THREE.Vector3();
  return raycaster.ray.intersectPlane(groundPlane, p) ? p : null;
}
function updateGhost(p) {
  if (!p) { ghost.visible = false; return; }
  ghost.visible = true;
  ghost.position.set(p.x, 0.05, p.z);
  ghostMat.color.setHex(canDeploy('player', p.x, p.z) ? 0x55ff99 : 0xff4444);
}

const cv = renderer.domElement;
cv.addEventListener('pointermove', e => { if (selected !== null && state === 'playing') updateGhost(pickGround(e)); });
cv.addEventListener('pointerdown', e => {
  if (state !== 'playing' || selected === null) return;
  const p = pickGround(e);
  if (!p) return;
  updateGhost(p);
  if (!canDeploy('player', p.x, p.z)) { toast('⛔ Zone interdite'); return; }
  const id = hand[selected], c = CARDS[id];
  if (elixir < c.cost) { toast('💧 Pas assez d\'élixir'); return; }
  elixir -= c.cost;
  spawn(id, 'player', p.x, p.z);
  playFromHand(selected);
});

function updateHUD() {
  $('elixirFill').style.width = (elixir / 10 * 100) + '%';
  $('elixirNum').textContent = Math.floor(elixir);
  [...handEl.querySelectorAll(':scope > .card')].forEach(el => el.classList.toggle('off', elixir < CARDS[el.dataset.id].cost));
  const s = Math.max(0, Math.ceil(timeLeft));
  $('timeTxt').textContent = Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
  $('x2').textContent = timeLeft <= 60 ? 'ÉLIXIR x2' : '';
  $('crPlayer').textContent = crowns.player;
  $('crEnemy').textContent = crowns.enemy;
}

/* =========================================================
   MENU PRINCIPAL : onglets JOUER / DECK
   ========================================================= */
let activeTab = 'play';
let infoCard = null;   // { id, from: 'deck' | 'coll' }
let swapping = null;   // carte de la collection en attente de placement

function setTab(tab) {
  activeTab = tab;
  document.querySelectorAll('.m-tabs button').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
  $('tabPlay').classList.toggle('active', tab === 'play');
  $('tabDeck').classList.toggle('active', tab === 'deck');
  if (tab !== 'deck') { swapping = null; infoCard = null; }
  renderMenu();
}
document.querySelectorAll('.m-tabs button').forEach(b => b.addEventListener('click', () => setTab(b.dataset.tab)));
$('deckMini').addEventListener('click', () => setTab('deck'));

function speedLabel(s) { return s < 1.4 ? 'Lente' : s < 2.2 ? 'Moyenne' : s < 3 ? 'Rapide' : 'Très rapide'; }

function renderMenu() {
  // Profil & ressources
  $('trophies').textContent = save.trophies;
  $('gold').textContent = save.gold;
  $('lvl').textContent = 1 + Math.floor(save.wins / 3);
  const ai_ = Math.min(ARENAS.length - 1, Math.floor(save.trophies / 300));
  $('arenaName').innerHTML = `ARÈNE ${ai_ + 1}<b>${ARENAS[ai_]}</b>`;
  $('record').textContent = `Victoires ${save.wins} · Défaites ${save.losses}`;

  // Aperçu du deck (onglet JOUER)
  const mini = $('deckMini');
  mini.innerHTML = '';
  save.deck.forEach(id => mini.appendChild(cardEl(id)));

  // Onglet DECK
  const avg = save.deck.reduce((s, id) => s + CARDS[id].cost, 0) / 8;
  $('avgCost').textContent = `Coût moyen : ${avg.toFixed(1)} 💧`;

  const dg = $('deckGrid');
  dg.innerHTML = '';
  save.deck.forEach((id, i) => {
    const el = cardEl(id, swapping ? 'wiggle' : (infoCard && infoCard.id === id ? 'picked' : ''));
    el.addEventListener('click', () => {
      if (swapping) {
        save.deck[i] = swapping;
        infoCard = { id: swapping, from: 'deck' };
        swapping = null;
        persist();
      } else {
        infoCard = infoCard && infoCard.id === id ? null : { id, from: 'deck' };
      }
      renderMenu();
    });
    dg.appendChild(el);
  });

  const coll = ALL_CARDS.filter(id => !save.deck.includes(id));
  const cg = $('collGrid');
  cg.innerHTML = '';
  cg.classList.toggle('empty', coll.length === 0);
  $('collCount').textContent = `${coll.length} carte${coll.length > 1 ? 's' : ''} hors deck`;
  coll.forEach(id => {
    const el = cardEl(id, (swapping === id || (infoCard && infoCard.id === id)) ? 'picked' : '');
    el.addEventListener('click', () => {
      swapping = null;
      infoCard = infoCard && infoCard.id === id ? null : { id, from: 'coll' };
      renderMenu();
    });
    cg.appendChild(el);
  });

  // Panneau d'informations
  const info = $('cardInfo');
  if (swapping) {
    const c = CARDS[swapping];
    info.innerHTML = `<div class="head"><span>${c.icon} <b>${c.name}</b></span><button class="btn grey" id="btnCancel">Annuler</button></div>
      <p class="hint" style="padding-top:.5em">👆 Touchez une carte du deck à remplacer</p>`;
    $('btnCancel').onclick = () => { swapping = null; renderMenu(); };
  } else if (infoCard) {
    const c = CARDS[infoCard.id];
    const btn = infoCard.from === 'coll' ? '<button class="btn green" id="btnUse">Utiliser</button>' : '';
    info.innerHTML = `<div class="head"><span>${c.icon} <b>${c.name}</b><span class="rar r-${c.rarity}">${RARITY_FR[c.rarity]}</span></span>${btn}</div>
      <p>${c.desc}</p>
      <div class="stats">
        <div><small>Points de vie</small>${c.hp}${c.count > 1 ? ' ×' + c.count : ''}</div>
        <div><small>Dégâts</small>${c.dmg}${c.splash ? ' (zone)' : ''}</div>
        <div><small>Coût</small>${c.cost} 💧</div>
        <div><small>Portée</small>${c.ranged ? c.range : 'Mêlée'}</div>
        <div><small>Vitesse</small>${speedLabel(c.speed)}</div>
        <div><small>Cible</small>${c.targets === 'buildings' ? 'Bâtiments' : 'Tout'}</div>
      </div>`;
    if (infoCard.from === 'coll') $('btnUse').onclick = () => { swapping = infoCard.id; renderMenu(); };
  } else {
    info.innerHTML = '<div class="hint">Touchez une carte pour voir ses statistiques</div>';
  }
}

/* =========================================================
   CYCLE DE PARTIE
   ========================================================= */
function clearAll() {
  units.forEach(u => { scene.remove(u.mesh); scene.remove(u.hpBar.group); });
  towers.forEach(t => { scene.remove(t.mesh); scene.remove(t.hpBar.group); t.label.remove(); });
  projectiles.forEach(p => scene.remove(p.mesh));
  fx.forEach(f => scene.remove(f.mesh));
  units = []; towers = []; projectiles = []; fx = [];
}
function buildTowers() {
  for (const team of ['player', 'enemy']) {
    const s = TEAM[team].side;
    createTower(team, 'princess', -5.5, 10.8 * s);
    createTower(team, 'princess', 5.5, 10.8 * s);
    createTower(team, 'king', 0, 13.9 * s);
  }
}

function startGame() {
  clearAll();
  buildTowers();
  battleCamera();
  elixir = 5;
  const d = shuffle(save.deck);
  hand = d.slice(0, 4);
  queue = d.slice(4);
  selected = null;
  ai.deck = shuffle(ALL_CARDS).slice(0, 8);
  Object.assign(ai, { elixir: 5, next: ai.deck[0], cd: 4 });
  crowns = { player: 0, enemy: 0 };
  timeLeft = MATCH_TIME;
  renderHand();
  selectCard(null);
  $('overlay').classList.add('hidden');
  gameEl.classList.remove('in-menu');
  state = 'playing';
}

function endGame() {
  if (state !== 'playing') return;
  state = 'over';
  selectCard(null);
  let title, text, delta = 0, gold = 0;
  if (crowns.player > crowns.enemy) {
    title = '🏆 VICTOIRE !'; text = 'Bravo, vous avez écrasé l\'IA.'; delta = 30; gold = 50; save.wins++;
  } else if (crowns.player < crowns.enemy) {
    title = '💀 DÉFAITE'; text = 'L\'IA a eu le dessus cette fois.'; delta = -Math.min(25, save.trophies); save.losses++;
  } else {
    title = '🤝 ÉGALITÉ'; text = 'Aucun vainqueur à la fin du temps.'; gold = 10;
  }
  save.trophies += delta;
  save.gold += gold;
  persist();
  setTimeout(() => {
    $('ovTitle').textContent = title;
    $('ovText').innerHTML = `${text}<br>👑 Vous ${crowns.player} – ${crowns.enemy} IA<br>
      <span class="trophy">${delta >= 0 ? '+' : ''}${delta} 🏆</span>${gold ? ` &nbsp; <span class="trophy">+${gold} 🪙</span>` : ''}`;
    $('overlay').classList.remove('hidden');
  }, 900);
}

function showMenu() {
  clearAll();
  buildTowers();
  state = 'menu';
  $('overlay').classList.add('hidden');
  gameEl.classList.add('in-menu');
  setTab('play');
}

$('ovBtn').addEventListener('click', showMenu);
$('btnBattle').addEventListener('click', startGame);

/* =========================================================
   BOUCLE PRINCIPALE
   ========================================================= */
const clock = new THREE.Clock();
const _v = new THREE.Vector3();
let elapsed = 0, menuAngle = 0;

function syncVisuals(dt) {
  const showBars = state !== 'menu';
  for (const u of units) {
    if (!u.alive) continue;
    u.mesh.position.set(u.x, 0, u.z);
    if (u.deploy > 0) {
      const k = 1 - u.deploy;
      u.body.position.y = Math.max(0, (0.4 - k) / 0.4) * 4;
      u.body.scale.setScalar(0.5 + Math.min(1, k * 2) * 0.5);
      u.mats.forEach(m => { m.transparent = true; m.opacity = 0.55; });
    } else {
      u.body.scale.setScalar(1);
      u.body.position.y = u.walking ? Math.abs(Math.sin(elapsed * 10 + u.phase)) * 0.12 : 0;
      if (u.type === 'valkyrie') {           // attaque tournoyante
        u.body.rotation.y = u.lunge > 0 ? (1 - u.lunge / 0.25) * Math.PI * 2 : 0;
        u.body.position.z = 0;
      } else {
        u.body.position.z = u.lunge > 0 ? Math.sin((u.lunge / 0.25) * Math.PI) * 0.3 : 0;
      }
      if (u.mats[0].transparent) u.mats.forEach(m => { m.transparent = false; m.opacity = 1; });
    }
    u.flash -= dt;
    u.mats.forEach(m => m.emissive && m.emissive.setHex(u.flash > 0 ? 0x777777 : 0x000000));
    u.hpBar.group.position.set(u.x, u.stats.barY, u.z);
    u.hpBar.group.quaternion.copy(camera.quaternion);
    u.hpBar.fg.scale.x = Math.max(0.001, u.hp / u.maxHp);
  }
  for (const t of towers) {
    if (!t.alive) continue;
    t.hpBar.group.visible = showBars;
    t.flash -= dt;
    t.mats.forEach(m => m.emissive && m.emissive.setHex(t.flash > 0 ? 0x553333 : (m.color.getHex() === 0xffcf3a ? 0x332200 : 0)));
    t.hpBar.group.position.set(t.x, t.barY, t.z);
    t.hpBar.group.quaternion.copy(camera.quaternion);
    t.hpBar.fg.scale.x = Math.max(0.001, t.hp / t.maxHp);
    if (showBars) {
      _v.set(t.x, t.barY + 0.35, t.z).project(camera);
      t.label.style.left = ((_v.x + 1) / 2 * 100) + '%';
      t.label.style.top = ((1 - _v.y) / 2 * 100) + '%';
      t.label.textContent = (t.type === 'king' && !t.active ? '💤 ' : '') + Math.ceil(t.hp);
    }
  }
}

function loop() {
  requestAnimationFrame(loop);
  const dt = Math.min(clock.getDelta(), 0.05);
  elapsed += dt;
  riverTex.offset.x += dt * 0.08;

  if (state === 'menu') {
    // Caméra qui tourne lentement autour de l'arène derrière le menu
    menuAngle += dt * 0.12;
    camera.position.set(Math.sin(menuAngle) * 28, 24, Math.cos(menuAngle) * 28);
    camera.lookAt(0, 0, 0);
  }

  if (state === 'playing') {
    timeLeft -= dt;
    const rate = ELIXIR_RATE * (timeLeft <= 60 ? 2 : 1);
    elixir = Math.min(10, elixir + rate * dt);
    updateAI(dt, rate);
    for (const u of units) if (u.alive) updateUnit(u, dt);
    for (const t of towers) updateTower(t, dt);
    resolveCollisions();
    updateProjectiles(dt);
    units = units.filter(u => u.alive);
    if (selected !== null) for (const s of ['-1', '1']) zonePocket[s].visible = pocketOpen('player', +s);
    if (timeLeft <= 0) { timeLeft = 0; endGame(); }
    updateHUD();
  }
  updateFx(dt);
  syncVisuals(dt);
  renderer.render(scene, camera);
}

buildTowers();
renderMenu();
loop();
})();
</script>
